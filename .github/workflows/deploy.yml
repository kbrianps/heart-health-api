name: Deploy

# Deploy automático no Fly.io após push em main, mas apenas se o workflow
# de CI tiver passado primeiro. Garante que código quebrado nunca chega
# à produção.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

jobs:
  deploy:
    name: Deploy no Fly.io
    runs-on: ubuntu-latest

    # Só roda se o CI tiver passado com sucesso
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup do flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy no Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke test em produção
        run: |
          sleep 5
          curl --fail --silent --show-error \
            https://heart-health-api.kbrianps.com/healthz | tee /dev/stderr
